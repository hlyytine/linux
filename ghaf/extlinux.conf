TIMEOUT 30
DEFAULT primary

MENU TITLE L4T boot options

LABEL primary
      MENU LABEL primary kernel
      LINUX /boot/Image
      INITRD /boot/initrd
      FDT /boot/dtb/tegra234-p3737-0000+p3701-0000.dtb
      APPEND ${cbootargs} root=PARTUUID=02846a3a-ce80-4858-8868-42836b030647 rw rootwait rootfstype=ext4 mminit_loglevel=4 console=ttyTCU0,115200 console=ttyAMA0,115200 firmware_class.path=/etc/firmware fbcon=map:0 nospectre_bhb video=efifb:off console=tty0

LABEL backup
      MENU LABEL backup
      LINUX /boot/Image.backup
      INITRD /boot/initrd.backup
      APPEND ${cbootargs} root=PARTUUID=02846a3a-ce80-4858-8868-42836b030647 rw rootwait rootfstype=ext4 mminit_loglevel=4 console=ttyTCU0,115200 console=ttyAMA0,115200 firmware_class.path=/etc/firmware fbcon=map:0 nospectre_bhb video=efifb:off console=tty0 

